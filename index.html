<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digitz Creative is a Trichy digital marketing and creative agency. Strategy, content, influencer marketing, and performance — built for business growth."
    />
    <meta name="theme-color" content="#F7F8FA" />
    <style>
      /* Instant boot cover — before JS/CSS bundle */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 55% at 20% 15%, rgb(86 194 252 / 0.18), transparent 50%),
          radial-gradient(ellipse 55% 45% at 85% 80%, rgb(88 184 50 / 0.14), transparent 48%),
          #f7f8fa;
        color: #0f0f0f;
        font-family: "Plus Jakarta Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
        transition: opacity 0.48s ease, visibility 0.48s ease;
      }
      .boot-splash.is-exit {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-splash__glow {
        position: absolute;
        width: min(28rem, 70vw);
        height: min(28rem, 70vw);
        border-radius: 50%;
        background: radial-gradient(circle, rgb(21 120 184 / 0.12), transparent 68%);
        filter: blur(12px);
        pointer-events: none;
      }
      .boot-splash__inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
      }
      .boot-splash__mark {
        width: 4.25rem;
        height: auto;
        animation: boot-float 1.6s ease-in-out infinite;
      }
      .boot-splash__brand {
        margin: 0;
        font-size: clamp(1.15rem, 2.4vw, 1.45rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #1486d4;
      }
      .boot-splash__brand span {
        color: #58b832;
      }
      .boot-splash__bar {
        width: 7.5rem;
        height: 2px;
        border-radius: 999px;
        background: rgb(15 15 15 / 0.08);
        overflow: hidden;
      }
      .boot-splash__bar span {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1578b8, #58b832, #c9a227);
        animation: boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      html.is-booting,
      html.is-booting body {
        overflow: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark,
        .boot-splash__bar span {
          animation: none;
        }
        .boot-splash {
          transition-duration: 0.01ms;
        }
      }
    </style>
    <meta property="og:title" content="Digitz Creative — Elevating Brands Digitally" />
    <meta
      property="og:description"
      content="We don’t just create content. We create business impact. Digital marketing, branding, and growth for business owners in Trichy and Tamil Nadu."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Digitz Creative — Elevating Brands Digitally</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Figtree:wght@600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Outfit:wght@600;700;800&family=Oxanium:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Schibsted+Grotesk:wght@600;700;800&family=Sora:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&family=Syne:wght@500;600;700;800&family=Titan+One&family=Unbounded:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-live="polite" aria-label="Loading Digitz Creative">
      <div class="boot-splash__glow" aria-hidden="true"></div>
      <div class="boot-splash__inner">
        <svg class="boot-splash__mark" viewBox="0 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="htmlBootRocket" x1="70" y1="8" x2="20" y2="110" gradientUnits="userSpaceOnUse">
              <stop stop-color="#F5C242" />
              <stop offset="0.3" stop-color="#7CDE4A" />
              <stop offset="0.72" stop-color="#00C2F0" />
              <stop offset="1" stop-color="#1A86E0" />
            </linearGradient>
            <linearGradient id="htmlBootTrail" x1="62" y1="70" x2="8" y2="145" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00C2F0" />
              <stop offset="0.6" stop-color="#F5A623" />
              <stop offset="1" stop-color="#F5C242" />
            </linearGradient>
          </defs>
          <path d="M62 78c-22 18-40 38-46 58" stroke="url(#htmlBootTrail)" stroke-width="9" stroke-linecap="round" />
          <rect x="14" y="102" width="9" height="9" rx="1.5" fill="#F5C242" />
          <rect x="28" y="114" width="7" height="7" rx="1.2" fill="#F59E0B" />
          <rect x="8" y="120" width="7" height="7" rx="1.2" fill="#38BDF8" />
          <rect x="38" y="128" width="6" height="6" rx="1" fill="#84CC16" />
          <rect x="20" y="134" width="5" height="5" rx="1" fill="#00C2F0" />
          <g transform="translate(78 62) rotate(-38)">
            <path d="M0-42c14 20 17 40 8 64L0 32  -8 20C-17-2-14-22 0-42z" fill="url(#htmlBootRocket)" />
            <circle cy="-8" r="6.5" fill="#0B1A2E" />
            <path d="M-8 24l-18 15 16-6.5z" fill="#1A9FE0" />
            <path d="M8 24l18 15-16-6.5z" fill="#7CDE4A" />
          </g>
        </svg>
        <p class="boot-splash__brand">Digitz <span>Creative</span></p>
        <div class="boot-splash__bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script>
      try {
        if (sessionStorage.getItem('digitz-boot-seen') === '1') {
          document.getElementById('boot-splash')?.remove()
        } else {
          document.documentElement.classList.add('is-booting')
        }
      } catch (e) {
        document.documentElement.classList.add('is-booting')
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
